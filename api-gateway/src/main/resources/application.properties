spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# Course Service
spring.cloud.gateway.server.webmvc.routes[1].id=course-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://course-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/courses/**

# Enrollment Service
spring.cloud.gateway.server.webmvc.routes[2].id=enrollment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://enrollment-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/enrollments/**

# Auth
spring.cloud.gateway.server.webmvc.routes[3].id=auth
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/auth/**

logging.level.org.springframework.cloud.gateway=DEBUG